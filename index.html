<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Lamp Research Presentation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app" id="appShell">
  <header class="topbar">
    <div class="brand"><span class="brand-dot"></span><span>SMART LAMP · RESEARCH</span></div>
    <div class="top-actions">
      <button id="themeBtn" class="icon-btn" title="Ganti tema">☀</button>
      <button id="fullscreenBtn" class="icon-btn" title="Fullscreen">⛶</button>
    </div>
  </header>

  <aside id="sidebar" class="sidebar">
    <div class="sidebar-title">Presentation</div>
    <nav id="slideNav"></nav>
    <button id="collapseBtn" class="collapse-btn">‹</button>
  </aside>

  <main class="stage">
    <div id="slides" class="slides"></div>
  </main>

  <footer class="controls">
    <button id="prevBtn" class="nav-btn">← Previous</button>
    <div class="progress-wrap">
      <div class="progress-track"><div id="progress" class="progress"></div></div>
      <span id="pageNumber">01 / 20</span>
    </div>
    <button id="nextBtn" class="nav-btn">Next →</button>
  </footer>
</div>

<div id="lightbox" class="lightbox">
  <button id="closeLightbox" aria-label="Tutup">×</button>
  <button id="lightboxPrev" class="lightbox-arrow" aria-label="Foto sebelumnya">‹</button>
  <img id="lightboxImg" alt="Dokumentasi">
  <button id="lightboxNext" class="lightbox-arrow" aria-label="Foto berikutnya">›</button>
  <div class="lightbox-caption" id="lightboxCaption"></div>
</div>

<script src="script.js"></script>
</body>
</html>
